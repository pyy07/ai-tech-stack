name: Daily Tech Stack Update

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional category limit (empty = all)"
        required: false
        default: ""
      skip_downloads:
        description: "Skip npm/PyPI downloads"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: pnpm install --frozen-lockfile

      - name: Restore metrics database
        uses: actions/cache@v4
        with:
          path: data/metrics.db
          key: metrics-db-${{ github.run_id }}
          restore-keys: |
            metrics-db-

      - name: Run pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ "${{ inputs.skip_downloads }}" = "true" ]; then
            ARGS="$ARGS --skip-downloads"
          fi
          pnpm pipeline:run -- $ARGS

      - name: Commit snapshot data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/*.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: daily AI tech stack snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
